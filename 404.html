<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الصفحة غير موجودة | E-School</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Cairo',sans-serif;
    background:linear-gradient(135deg,#0a1628 0%,#0d2444 60%,#0a1628 100%);
    color:#e8edf5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    direction:rtl;
  }
  .box{max-width:420px;}
  .logo-icon{
    width:64px;height:64px;margin:0 auto 20px;
    background:linear-gradient(135deg,#1e90ff,#00d4aa);
    border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:900;color:#fff;
    box-shadow:0 0 20px rgba(30,144,255,.4);
  }
  h1{font-size:56px;font-weight:900;color:#1e90ff;margin-bottom:8px;}
  h2{font-size:18px;font-weight:800;margin-bottom:10px;}
  p{font-size:13px;color:#8a9ab8;line-height:1.7;margin-bottom:24px;}
  a.btn{
    display:inline-block;
    background:linear-gradient(135deg,#1e90ff,#0070cc);
    color:#fff;text-decoration:none;
    padding:11px 26px;border-radius:8px;
    font-size:14px;font-weight:700;
    box-shadow:0 4px 14px rgba(30,144,255,.35);
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo-icon">ES</div>
    <h1>404</h1>
    <h2>عذراً، الصفحة غير موجودة</h2>
    <p>الرابط الذي فتحته غير صحيح أو تم نقله. تأكد من الرابط أو ارجع للصفحة الرئيسية.</p>
    <a class="btn" href="/eschool/">🏠 العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
